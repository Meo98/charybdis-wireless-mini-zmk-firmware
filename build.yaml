# Build matrix describing every board/shield/keymap combo to build.
# Each entry under `include` becomes a single matrix item in CI and
# the local build script.
#
# ── Gekuerzt fuer meo (2026-10-11) ───────────────────────────────────────────
# Dieser Fork baut nur, was tatsaechlich gebraucht wird: das Reset-Image und
# die kabellose Variante mit QWERTY. Das Original baut zusaetzlich saemtliche
# Dongle- und Prospector-Varianten -- rund dreissig Durchlaeufe, die hier nur
# Zeit kosten. Die vollstaendige Matrix steht unveraendert im Upstream-Repo
# 280Zo/charybdis-wireless-mini-zmk-firmware und laesst sich von dort
# jederzeit zurueckholen.

board: [ nice_nano//zmk ]

include:

# ── Reset Firmware ────────────────────────────────────────────────────────────
  - name: settings_reset
    board: nice_nano//zmk
    shield: settings_reset

# ── Bluetooth (BT) Firmwares ─────────────────────────────────────────────────
  - name: bt
    board: nice_nano//zmk
    shield:
      - charybdis_left_bt
      - charybdis_right_bt
    keymap:
      - qwerty
